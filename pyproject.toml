[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reliss"
version = "0.0.0"
description = "ReLiSS inference and evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "ReLiSS contributors"}]
dependencies = ["numpy<2", "scipy", "nibabel", "einops", "monai==1.3.0", "nnunetv2==2.2.1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
hub = ["huggingface-hub"]

[tool.setuptools.packages.find]
include = ["reliss*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
